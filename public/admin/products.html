<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Database - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
        .header { background: #FFD700; padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { color: #333; }
        .nav-links a { color: #333; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; }
        button { background: #FFD700; padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .product-list { background: white; border-radius: 15px; padding: 20px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .product-name { font-weight: bold; }
        .product-barcode { font-size: 11px; color: #999; }
        .delete-btn { background: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; }
        .stats { background: #e8f5e9; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .stats span { font-weight: bold; color: #00b894; font-size: 24px; }
        .search-box { margin-bottom: 20px; }
        .error-message { color: red; margin-top: 10px; display: none; }
        .success-message { color: green; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Central Product Database</h1>
            <div class="nav-links">
                <a href="/admin/dashboard">Dashboard</a>
                <a href="/admin/products">Products DB</a>
                <a href="/admin/logout">Logout</a>
            </div>
        </div>
        
        <div class="stats" id="stats">Loading...</div>
        
        <div class="form-card">
            <h3>Add New Product</h3>
            <input type="text" id="barcode" placeholder="Barcode">
            <input type="text" id="productName" placeholder="Product Name">
            <input type="text" id="brand" placeholder="Brand">
            <select id="category">
                <option value="">Select Category</option>
                <option value="Bread & Bakery">Bread & Bakery</option>
                <option value="Dairy">Dairy</option>
                <option value="Drinks">Drinks</option>
                <option value="Snacks">Snacks</option>
                <option value="Rice & Pasta">Rice & Pasta</option>
                <option value="Canned Goods">Canned Goods</option>
                <option value="Household">Household</option>
                <option value="Other">Other</option>
            </select>
            <input type="url" id="imageUrl" placeholder="Image URL (optional)">
            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>
            <button onclick="addProduct()">Add to Database</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">
        </div>
        
        <div class="product-list">
            <h3>Products in Database</h3>
            <div id="productsList">Loading...</div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/admin/api';
        
        async function addProduct() {
            const barcode = document.getElementById('barcode').value.trim();
            const product_name = document.getElementById('productName').value.trim();
            const brand = document.getElementById('brand').value.trim();
            const category = document.getElementById('category').value;
            const default_image = document.getElementById('imageUrl').value.trim();
            
            // Clear previous messages
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
            
            // Validate
            if (!barcode) {
                showError('Barcode is required');
                return;
            }
            if (!product_name) {
                showError('Product Name is required');
                return;
            }
            
            const product = { barcode, product_name, brand, category, default_image };
            
            try {
                console.log('Sending product:', product);
                const response = await fetch(`${API_BASE}/central-products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(product)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showSuccess('Product added successfully!');
                    clearForm();
                    loadProducts();
                    loadStats();
                } else {
                    const error = await response.json();
                    showError(error.error || 'Error adding product');
                }
            } catch (err) {
                console.error('Add product error:', err);
                showError('Network error: ' + err.message);
            }
        }
        
        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }
        
        function showSuccess(msg) {
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = msg;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
        
        function clearForm() {
            document.getElementById('barcode').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('brand').value = '';
            document.getElementById('category').value = '';
            document.getElementById('imageUrl').value = '';
        }
        
        async function loadProducts() {
            try {
                const res = await fetch(`${API_BASE}/central-products`);
                if (!res.ok) throw new Error('Failed to load products');
                const products = await res.json();
                displayProducts(products);
            } catch (err) {
                console.error('Load products error:', err);
                document.getElementById('productsList').innerHTML = '<p>Error loading products</p>';
            }
        }
        
        function displayProducts(products) {
            const container = document.getElementById('productsList');
            if (!products.length) {
                container.innerHTML = '<p>No products yet. Add your first product above.</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="product-item">
                    <div>
                        <div class="product-name">${escapeHtml(p.product_name)}</div>
                        <div class="product-barcode">${p.barcode}</div>
                        ${p.brand ? `<small>${escapeHtml(p.brand)}</small>` : ''}
                    </div>
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
                </div>
            `).join('');
        }
        
        async function searchProducts() {
            const search = document.getElementById('search').value;
            try {
                const res = await fetch(`${API_BASE}/central-products?search=${encodeURIComponent(search)}`);
                const products = await res.json();
                displayProducts(products);
            } catch (err) {
                console.error('Search error:', err);
            }
        }
        
        async function deleteProduct(id) {
            if (confirm('Delete this product from the database?')) {
                try {
                    const res = await fetch(`${API_BASE}/central-products/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        loadProducts();
                        loadStats();
                    } else {
                        alert('Error deleting product');
                    }
                } catch (err) {
                    alert('Network error');
                }
            }
        }
        
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/central-products`);
                const products = await res.json();
                document.getElementById('stats').innerHTML = `<span>${products.length}</span> products in database`;
            } catch (err) {
                document.getElementById('stats').innerHTML = 'Error loading stats';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadProducts();
        loadStats();
    </script>
</body>
</html>
