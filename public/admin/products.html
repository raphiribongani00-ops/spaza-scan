<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Database - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
        .header { background: #FFD700; padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { color: #333; }
        .nav-links a { color: #333; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #e0e0e0; border-radius: 10px; }
        button { background: #FFD700; padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .product-list { background: white; border-radius: 15px; padding: 20px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .product-name { font-weight: bold; }
        .product-barcode { font-size: 11px; color: #999; }
        .delete-btn { background: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; }
        .stats { background: #e8f5e9; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .stats span { font-weight: bold; color: #00b894; font-size: 24px; }
        .search-box { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Central Product Database</h1>
            <div class="nav-links">
                <a href="/admin/dashboard">Dashboard</a>
                <a href="/admin/products">Products DB</a>
                <a href="/admin/logout">Logout</a>
            </div>
        </div>
        
        <div class="stats" id="stats">Loading...</div>
        
        <div class="form-card">
            <h3>Add New Product</h3>
            <input type="text" id="barcode" placeholder="Barcode">
            <input type="text" id="productName" placeholder="Product Name">
            <input type="text" id="brand" placeholder="Brand">
            <select id="category">
                <option value="">Select Category</option>
                <option value="Bread & Bakery">Bread & Bakery</option>
                <option value="Dairy">Dairy</option>
                <option value="Drinks">Drinks</option>
                <option value="Snacks">Snacks</option>
                <option value="Other">Other</option>
            </select>
            <input type="url" id="imageUrl" placeholder="Image URL (optional)">
            <button onclick="addProduct()">Add to Database</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">
        </div>
        
        <div class="product-list">
            <h3>Products in Database</h3>
            <div id="productsList">Loading...</div>
        </div>
    </div>
    
    <script>
        // ✅ CORRECT API BASE (matches server.js)
        const API_BASE = '/api/admin';
        
        async function addProduct() {
            const product = {
                barcode: document.getElementById('barcode').value,
                product_name: document.getElementById('productName').value,
                brand: document.getElementById('brand').value,
                category: document.getElementById('category').value,
                default_image: document.getElementById('imageUrl').value
            };
            if (!product.barcode || !product.product_name) {
                alert('Barcode and Product Name required');
                return;
            }
            const res = await fetch(`${API_BASE}/central-products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            });
            if (res.ok) {
                alert('Product added!');
                clearForm();
                loadProducts();
            } else {
                const error = await res.json();
                alert(error.error || 'Error adding product');
            }
        }
        
        function clearForm() {
            document.getElementById('barcode').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('brand').value = '';
            document.getElementById('category').value = '';
            document.getElementById('imageUrl').value = '';
        }
        
        async function loadProducts() {
            const res = await fetch(`${API_BASE}/central-products`);
            const products = await res.json();
            displayProducts(products);
            document.getElementById('stats').innerHTML = `<span>${products.length}</span> products in database`;
        }
        
        function displayProducts(products) {
            const container = document.getElementById('productsList');
            if (products.length === 0) {
                container.innerHTML = '<p>No products yet.</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="product-item">
                    <div>
                        <div class="product-name">${escapeHtml(p.product_name)}</div>
                        <div class="product-barcode">${p.barcode}</div>
                        ${p.brand ? `<small>${escapeHtml(p.brand)}</small>` : ''}
                    </div>
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
                </div>
            `).join('');
        }
        
        async function searchProducts() {
            const search = document.getElementById('search').value;
            const res = await fetch(`${API_BASE}/central-products?search=${encodeURIComponent(search)}`);
            const products = await res.json();
            displayProducts(products);
        }
        
        async function deleteProduct(id) {
            if (confirm('Delete this product?')) {
                await fetch(`${API_BASE}/central-products/${id}`, { method: 'DELETE' });
                loadProducts();
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadProducts();
    </script>
</body>
</html>
